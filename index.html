<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><meta name="theme-color" content="#38251c"/><title>Triunfo | Sobremesas</title><link rel="stylesheet" href="style.css?v=mobile-portrait-20261108-7"/><style>#opening-screen{background:#38251c url("assets/abertura-mobile-v3.jpg?v=mobile-portrait-20261108-7") center/cover no-repeat!important}#opening-screen::before{display:none!important}#opening-screen picture{position:absolute;inset:0;width:100%;height:100%;display:block}#opening-screen img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:contain!important;max-width:none!important;max-height:none!important}@media(max-width:650px){#opening-screen{background-image:url("assets/abertura-desktop-v3.jpg?v=mobile-portrait-20261108-7")!important}}</style></head><body><div id="opening-screen" aria-label="Triunfo"><picture><source media="(max-width:650px)" srcset="assets/abertura-desktop-v3.jpg?v=mobile-portrait-20261108-7"><img id="opening-art" src="assets/abertura-mobile-v3.jpg?v=mobile-portrait-20261108-7" alt="Triunfo"></picture></div><div id="app"></div><script src="app.js?v=mobile-portrait-20261108-7"></script><script>window.addEventListener("load",function(){window.setTimeout(function(){var screen=document.getElementById("opening-screen");if(screen){screen.classList.add("opening-screen-hidden");window.setTimeout(function(){screen.remove()},350)}},5000)});</script></body></html>
