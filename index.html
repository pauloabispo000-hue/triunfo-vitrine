<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><meta name="theme-color" content="#38251c"/><title>Triunfo | Sobremesas</title><link rel="stylesheet" href="style.css?v=mobile-splash-fix-15"/><style>#opening-screen{position:fixed;inset:0;z-index:9999;background:#38251c;overflow:hidden}#opening-screen picture,#opening-screen img{display:block;width:100%;height:100%;}#opening-screen img{object-fit:contain;object-position:center}#opening-screen::before{content:none!important}@media(max-width:650px){#opening-screen{background:#38251c url("assets/abertura-desktop-v3.jpg") center/cover no-repeat}#opening-screen img{object-fit:contain!important}}@media(min-width:651px){#opening-screen{background:#38251c url("assets/abertura-mobile-v3.jpg") center/cover no-repeat}}</style></head><body><div id="opening-screen" aria-label="Triunfo"><picture><source media="(max-width:650px)" srcset="assets/abertura-desktop-v3.jpg?v=seamless-opening-20261108-8"><img id="opening-art" src="assets/abertura-mobile-v3.jpg?v=seamless-opening-20261108-8" alt="Triunfo"></picture></div><div id="app"></div><script src="app.js?v=restore-functional-ui-20261108-13"></script><script>window.addEventListener("load",function(){window.setTimeout(function(){var screen=document.getElementById("opening-screen");if(screen){screen.classList.add("opening-screen-hidden");window.setTimeout(function(){screen.remove()},350)}},5000)});</script></body></html>
